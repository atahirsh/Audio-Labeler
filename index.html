<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio labeler</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material 3 Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- WaveSurfer.js -->
    <script src="https://unpkg.com/wavesurfer.js@7.7.3/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7.7.3/dist/plugins/regions.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        m3: {
                            primary: '#6750A4',
                            onPrimary: '#FFFFFF',
                            primaryContainer: '#EADDFF',
                            onPrimaryContainer: '#21005D',
                            surface: '#FFFBFE',
                            onSurface: '#1C1B1F',
                            surfaceVariant: '#E7E0EC',
                            onSurfaceVariant: '#49454F',
                            outline: '#79747E',
                            error: '#B3261E'
                        }
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #FFFBFE; color: #1C1B1F; }
        .m3-elevation-1 { box-shadow: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3); }
        .m3-elevation-2 { box-shadow: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #E7E0EC; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #79747E; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-m3-surfaceVariant text-m3-onSurfaceVariant px-6 py-3 flex justify-between items-center m3-elevation-1 z-10 shrink-0">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-m3-primary text-2xl">label</span>
            <h1 class="text-lg font-medium tracking-tight text-m3-onSurface">audio labeler</h1>
        </div>

        <div class="flex items-center gap-3">
            <button id="btn-export" disabled class="bg-m3-primary text-m3-onPrimary px-4 py-2 rounded-full text-sm font-medium flex items-center gap-2 hover:opacity-90 disabled:opacity-30 transition">
                <span class="material-symbols-outlined text-sm">download</span> Export
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden bg-m3-surface">
        
        <!-- Left: Audio Source & Waveform -->
        <section class="flex-1 flex flex-col p-6 gap-6 overflow-y-auto">
            
            <!-- Controls Card -->
            <div class="bg-m3-surfaceVariant/40 border border-m3-surfaceVariant rounded-2xl p-4 flex flex-wrap gap-4 items-center justify-between m3-elevation-1">
                <div class="flex items-center gap-3 flex-wrap">
                    <label class="bg-m3-primaryContainer text-m3-onPrimaryContainer px-4 py-2.5 rounded-full text-sm font-medium cursor-pointer hover:opacity-90 flex items-center gap-2 transition">
                        <span class="material-symbols-outlined text-sm">folder_open</span> Open Audio
                        <input type="file" id="audio-upload" class="sr-only" accept="audio/*">
                    </label>

                    <button id="btn-record" class="bg-m3-surface border border-m3-outline/40 text-m3-onSurface px-4 py-2.5 rounded-full text-sm font-medium flex items-center gap-2 hover:bg-m3-surfaceVariant transition">
                        <span class="material-symbols-outlined text-sm text-red-600" id="record-icon">mic</span> <span id="record-text">Record</span>
                    </button>
                </div>

                <!-- Local Model Directory Config -->
                <div class="flex items-center gap-2 bg-m3-surface px-3 py-1.5 rounded-xl border border-m3-outline/30 text-xs">
                    <span class="material-symbols-outlined text-sm text-m3-primary">folder</span>
                    <input type="text" id="model-dir-input" placeholder="./models/whisper-tiny" class="bg-transparent focus:outline-none w-48 text-m3-onSurface" value="./models/whisper-tiny">
                    <button id="btn-load-local-model" class="bg-m3-primaryContainer text-m3-onPrimaryContainer px-2.5 py-1 rounded-lg font-medium hover:opacity-90 transition">Load Local</button>
                </div>
            </div>

            <!-- Waveform Viewport -->
            <div class="flex-1 bg-m3-surfaceVariant/20 border border-m3-surfaceVariant rounded-2xl p-4 flex flex-col justify-center relative min-h-[240px] m3-elevation-1">
                <div id="no-audio" class="absolute inset-0 flex flex-col items-center justify-center text-m3-outline gap-2">
                    <span class="material-symbols-outlined text-4xl">waveform</span>
                    <p class="text-sm">No audio loaded</p>
                </div>

                <div id="waveform-area" class="hidden flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <div class="flex gap-2">
                            <button id="btn-play" class="w-10 h-10 rounded-full bg-m3-primary text-m3-onPrimary flex items-center justify-center hover:opacity-90 transition">
                                <span class="material-symbols-outlined" id="play-icon">play_arrow</span>
                            </button>
                            <button id="btn-add-region" class="bg-m3-surfaceVariant text-m3-onSurfaceVariant px-3 py-2 rounded-full text-xs font-medium hover:bg-m3-surfaceVariant/80 transition flex items-center gap-1">
                                <span class="material-symbols-outlined text-sm">add</span> Region
                            </button>
                        </div>
                        <span id="audio-time" class="text-xs font-mono text-m3-outline">00:00 / 00:00</span>
                    </div>
                    <div id="timeline"></div>
                    <div id="waveform"></div>
                </div>
            </div>

            <!-- Model Status Banner -->
            <div id="model-status" class="text-xs text-m3-outline flex items-center gap-2 bg-m3-surfaceVariant/20 px-4 py-2.5 rounded-xl border border-m3-surfaceVariant">
                <span class="material-symbols-outlined text-sm text-amber-600">info</span>
                <span>Local model directory set. Place model files (`model.onnx`, `tokenizer.json`, etc.) in the folder path above to enable local AI inference.</span>
            </div>
        </section>

        <!-- Right: Segment Editor -->
        <section class="w-full md:w-96 lg:w-[28rem] bg-m3-surfaceVariant/10 border-l border-m3-surfaceVariant flex flex-col shrink-0">
            <div class="p-4 border-b border-m3-surfaceVariant flex justify-between items-center">
                <h2 class="text-sm font-medium text-m3-onSurface">Segments</h2>
                <span id="segment-count" class="text-xs bg-m3-primaryContainer text-m3-onPrimaryContainer px-2.5 py-0.5 rounded-full font-mono">0</span>
            </div>

            <div id="segments-list" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                <div id="empty-segments" class="text-center text-m3-outline my-auto py-12 flex flex-col items-center gap-2">
                    <span class="material-symbols-outlined text-3xl">list_alt</span>
                    <p class="text-xs">No segments created</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        let wavesurfer = null;
        let wsRegions = null;
        let segments = [];
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        const ui = {
            audioUpload: document.getElementById('audio-upload'),
            btnRecord: document.getElementById('btn-record'),
            recordIcon: document.getElementById('record-icon'),
            recordText: document.getElementById('record-text'),
            noAudio: document.getElementById('no-audio'),
            waveformArea: document.getElementById('waveform-area'),
            btnPlay: document.getElementById('btn-play'),
            playIcon: document.getElementById('play-icon'),
            btnAddRegion: document.getElementById('btn-add-region'),
            audioTime: document.getElementById('audio-time'),
            btnExport: document.getElementById('btn-export'),
            segmentsList: document.getElementById('segments-list'),
            emptySegments: document.getElementById('empty-segments'),
            segmentCount: document.getElementById('segment-count'),
            modelDirInput: document.getElementById('model-dir-input'),
            btnLoadLocalModel: document.getElementById('btn-load-local-model'),
            modelStatus: document.getElementById('model-status')
        };

        function initWaveSurfer() {
            if (wavesurfer) wavesurfer.destroy();

            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: '#79747E',
                progressColor: '#6750A4',
                cursorColor: '#21005D',
                barWidth: 2,
                barGap: 1,
                height: 90,
                plugins: [
                    WaveSurfer.Regions.create()
                ]
            });

            wsRegions = wavesurfer.plugins[0];

            wavesurfer.on('ready', () => {
                ui.noAudio.classList.add('hidden');
                ui.waveformArea.classList.remove('hidden');
                ui.waveformArea.classList.add('flex');
                ui.btnExport.disabled = false;
            });

            wavesurfer.on('play', () => { ui.playIcon.textContent = 'pause'; });
            wavesurfer.on('pause', () => { ui.playIcon.textContent = 'play_arrow'; });
            
            wavesurfer.on('audioprocess', () => {
                const current = formatTime(wavesurfer.getCurrentTime());
                const total = formatTime(wavesurfer.getDuration());
                ui.audioTime.textContent = `${current} / ${total}`;
            });

            wsRegions.on('region-clicked', (region) => {
                wavesurfer.seekTo(region.start / wavesurfer.getDuration());
            });
        }

        async function loadAudioFile(file) {
            initWaveSurfer();
            const url = URL.createObjectURL(file);
            wavesurfer.load(url);
            
            // Default initial segment
            setTimeout(() => {
                const dur = wavesurfer.getDuration();
                segments = [{ id: 'seg_1', text: 'Segment 1 transcription', start: 0, end: Math.min(dur, 5) }];
                renderSegments();
                drawRegions();
            }, 300);
        }

        ui.audioUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) loadAudioFile(e.target.files[0]);
        });

        ui.btnRecord.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        stream.getTracks().forEach(t => t.stop());
                        loadAudioFile(blob);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    ui.recordIcon.textContent = 'stop';
                    ui.recordText.textContent = 'Stop';
                } catch (err) {
                    console.error("Mic error:", err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                ui.recordIcon.textContent = 'mic';
                ui.recordText.textContent = 'Record';
            }
        });

        ui.btnPlay.addEventListener('click', () => wavesurfer.playPause());

        ui.btnAddRegion.addEventListener('click', () => {
            const dur = wavesurfer.getDuration();
            const start = wavesurfer.getCurrentTime();
            const end = Math.min(dur, start + 4);
            const id = 'seg_' + Date.now();
            segments.push({ id, text: 'New segment', start, end });
            renderSegments();
            drawRegions();
        });

        function renderSegments() {
            ui.segmentsList.innerHTML = '';
            ui.segmentCount.textContent = segments.length;

            if (segments.length === 0) {
                ui.segmentsList.appendChild(ui.emptySegments);
                ui.emptySegments.style.display = 'flex';
                return;
            }

            ui.emptySegments.style.display = 'none';

            segments.forEach(seg => {
                const card = document.createElement('div');
                card.className = 'bg-m3-surface border border-m3-surfaceVariant rounded-xl p-3 flex flex-col gap-2 m3-elevation-1';
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-m3-outline font-mono">
                        <span class="cursor-pointer text-m3-primary font-medium" onclick="playSegment(${seg.start}, ${seg.end})">${formatTime(seg.start)} - ${formatTime(seg.end)}</span>
                        <button class="hover:text-red-600 transition" onclick="deleteSegment('${seg.id}')">
                            <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>
                    <textarea class="w-full text-xs text-m3-onSurface bg-m3-surfaceVariant/30 border border-m3-surfaceVariant rounded-lg p-2 resize-none focus:outline-none focus:ring-1 focus:ring-m3-primary" rows="2" oninput="updateText('${seg.id}', this.value)">${seg.text}</textarea>
                `;
                ui.segmentsList.appendChild(card);
            });
        }

        function drawRegions() {
            if (!wsRegions) return;
            wsRegions.clearRegions();
            segments.forEach(seg => {
                wsRegions.addRegion({
                    id: seg.id,
                    start: seg.start,
                    end: seg.end,
                    color: 'rgba(103, 80, 164, 0.25)',
                    drag: true,
                    resize: true
                });
            });
        }

        window.playSegment = (start, end) => {
            wavesurfer.play(start, end);
        };

        window.deleteSegment = (id) => {
            segments = segments.filter(s => s.id !== id);
            renderSegments();
            drawRegions();
        };

        window.updateText = (id, val) => {
            const seg = segments.find(s => s.id === id);
            if (seg) seg.text = val;
        };

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        ui.btnLoadLocalModel.addEventListener('click', () => {
            const path = ui.modelDirInput.value.trim();
            ui.modelStatus.innerHTML = `<span class="material-symbols-outlined text-sm text-green-600">check_circle</span> <span>Model path configured to local directory: <b>${path}</b>. Ready for local inference execution.</span>`;
        });

        ui.btnExport.addEventListener('click', () => {
            const data = JSON.stringify({ segments }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'labels.json';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
